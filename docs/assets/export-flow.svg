<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title description">
  <title id="title">Relive 导出流程</title>
  <desc id="description">导入 SVG、GIF、MOV、MP4 或 MPV 素材，裁切片段并选择尺寸，再导出为 Live Photo 配对文件或 WebP。Live Photo 配对导入 iPhone 照片；WebP 从片段首帧开始，无声循环播放。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#34B27B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="960" height="360" rx="20" fill="#08090B"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" fill="#EEF1F0">
    <text x="32" y="42" font-size="24" font-weight="650">导出流程</text>
    <text x="32" y="73" font-size="18" fill="#A3ACA8">全部转换在本机执行，原素材不修改。</text>

    <rect x="32" y="130" width="182" height="168" rx="12" fill="#121416" stroke="#2B302E"/>
    <text x="54" y="169" font-size="24" font-weight="650">导入素材</text>
    <text x="54" y="212" font-size="18" fill="#A3ACA8">SVG · GIF · MOV</text>
    <text x="54" y="244" font-size="18" fill="#A3ACA8">MP4 · MPV</text>

    <rect x="283" y="130" width="220" height="168" rx="12" fill="#121416" stroke="#2B302E"/>
    <text x="307" y="169" font-size="24" font-weight="650">裁切 / 尺寸</text>
    <text x="307" y="212" font-size="18" fill="#A3ACA8">1080 / 1920 像素</text>
    <text x="307" y="244" font-size="18" fill="#A3ACA8">保持原比例，不放大</text>

    <g fill="none" stroke="#34B27B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 224 214 H 272" marker-end="url(#arrow)"/>
      <path d="M 513 214 H 547"/>
      <path d="M 547 214 V 154 H 582" marker-end="url(#arrow)"/>
      <path d="M 547 214 V 282 H 582" marker-end="url(#arrow)"/>
    </g>
    <circle cx="547" cy="214" r="4" fill="#34B27B"/>

    <rect x="594" y="102" width="334" height="106" rx="12" fill="#121416" stroke="#34B27B" stroke-opacity="0.65"/>
    <text x="618" y="133" font-size="24" font-weight="650">Live Photo</text>
    <text x="618" y="162" font-size="18" fill="#A3ACA8">JPEG + MOV / .pvt</text>
    <text x="618" y="191" font-size="18" fill="#A3ACA8">配对导入 → iPhone「照片」</text>

    <rect x="594" y="230" width="334" height="106" rx="12" fill="#121416" stroke="#34B27B" stroke-opacity="0.65"/>
    <text x="618" y="261" font-size="24" font-weight="650">WebP 动图</text>
    <text x="618" y="290" font-size="18" fill="#A3ACA8">单个 .webp</text>
    <text x="618" y="319" font-size="18" fill="#A3ACA8">首帧开始 · 无声循环</text>
  </g>
</svg>
