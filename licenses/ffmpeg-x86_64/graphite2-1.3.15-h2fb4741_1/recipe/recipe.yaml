schema_version: 1

context:
  version: "1.3.15"

package:
  name: graphite2
  version: ${{ version }}

source:
  url: https://github.com/silnrsi/graphite/releases/download/${{ version }}/graphite2-${{ version }}.tgz
  sha256: c6bc8b4252724665297f7cad0c55897285c673f9b8e6db3522ace833593fe0b1
  patches:
    # Windows patches from https://github.com/Alexpux/MINGW-packages/tree/master/mingw-w64-graphite2
    # 003 updated for 1.3.13.
    - if: win
      then: 001-graphite2-1.3.12-win64.patch
    - if: win
      then: 002-graphite2-1.2.1-pkgconfig.patch
    #- 003-graphite2-1.3.13-staticbuild.patch    # [win]
    - if: win
      then: 004-graphite2-1.3.12-dllimport-fix.patch

build:
  number: 1
  variant:
    ignore_keys:
      - python
  prefix_detection:
    ignore_binary_files: false

requirements:
  build:
    - cmake
    - if: win
      then: ninja
    - python
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - if: unix
      then: make
  host:
  run_exports:
    - ${{ pin_subpackage('graphite2') }}

tests:
  - package_contents:
      include:
        - graphite2/Font.h
      lib:
        - graphite2
      files:
        - if: win
          then: Library/lib/pkgconfig/graphite2.pc
          else: lib/pkgconfig/graphite2.pc
        - if: win
          then: Library/share/graphite2/graphite2.cmake
          else: share/graphite2/graphite2.cmake

about:
  license: LGPL-2.0-or-later
  license_file: COPYING
  summary: A "smart font" system that handles the complexities of lesser-known languages of the world.
  homepage: http://graphite.sil.org/
  repository: https://github.com/silnrsi/graphite

extra:
  recipe-maintainers:
    - pkgw
    - ocefpaf
