CI: azure
CONDA_BUILD_SYSROOT: /Applications/Xcode_13.2.1.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX11.0.sdk
MACOSX_DEPLOYMENT_TARGET: '11.0'
aom: '3.7'
build_platform: osx-64
bzip2: '1'
c_compiler: clang
c_compiler_version: '16'
channel_sources: conda-forge
channel_targets: conda-forge main
cpu_optimization_target: nocona
cran_mirror: https://cran.r-project.org
cxx_compiler: clangxx
cxx_compiler_version: '16'
dav1d: 1.2.1
extend_keys:
- ignore_version
- ignore_build_only_deps
- extend_keys
- pin_run_as_build
fontconfig: '2'
fortran_compiler: gfortran
freetype: '2'
glib: '2'
gmp: '6'
gnutls: '3.7'
harfbuzz: '8'
ignore_build_only_deps:
- numpy
- python
libiconv: '1'
libopenvino_dev: 2023.2.0
libxml2: '2'
license_family: gpl
lua: '5'
macos_machine: arm64-apple-darwin20.0.0
numpy: '1.22'
openh264: 2.4.0
perl: 5.26.2
pin_run_as_build:
  python:
    min_pin: x.x
    max_pin: x.x
  r-base:
    min_pin: x.x
    max_pin: x.x
python: '3.10'
r_base: '3.5'
svt_av1: 1.8.0
target_platform: osx-arm64
x264: 1!164.*
x265: '3.5'
xz: '5'
zip_keys:
- - c_compiler_version
  - cxx_compiler_version
zlib: '1.2'
